services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cinema_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cinema_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-tiket-film
      dockerfile: Dockerfile
    env_file:
      - ./backend-tiket-film/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cinema_db?schema=public
      JWT_SECRET: your_jwt_secret_key
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-tiket-film
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  postgres_data:
